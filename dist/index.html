<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Manim Educator — Visual tutor</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Manim Educator home"><span class="brand-icon">m.</span><span>Manim <b>Educator</b></span></a></header>
<main>
  <section class="board" aria-label="Learning canvas"></section>
  <section class="voice-dock" aria-label="Voice tutor">
    <div class="voice-side"><p>What would you like to learn?</p></div>
    <div class="orb-control"><button id="ask" class="orb-button" aria-label="Talk to your tutor — interface preview" aria-describedby="voice-status"><span class="orb-halo" aria-hidden="true"></span><span class="orb" aria-hidden="true"><span class="orb-flow"></span></span></button><span id="voice-status">Talk to your tutor</span></div>
    <div class="voice-side voice-meta"><span>Voice preview</span><p>Microphone is off</p></div>
  </section>
</main>
<div id="notice" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script>
</body></html>
